[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npupy_xdna"
version = "0.1.0"
description = "NPU-accelerated NumPy backend for AMD Ryzen XDNA2 (Krackan)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "npu: marks tests that require a physical NPU device (deselect with -m 'not npu')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["npupy_xdna*"]
